[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "point-line-stitch"
version = "0.1.0"
description = "Point-line and motion-aware three-region image stitching"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24",
  "opencv-contrib-python>=4.8",
]

[project.optional-dependencies]
full = [
  "einops>=0.6",
  "gdown>=4.7",
  "matplotlib>=3.7",
  "Pillow>=9",
  "tensorflow>=2.12",
  "torch>=1.13",
]
dev = ["pytest>=7"]
benchmark = ["scikit-image>=0.20"]

[project.scripts]
point-line-stitch = "point_line_stitch.cli:main"
image-stitch = "point_line_stitch.cli:main"
three-region-stitch = "three_region_stitch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
